name: Release build

# v で始まるタグ (例: v2.0.0) を push すると、単一 exe をビルドして GitHub Release に添付する。
# 手動実行 (Run workflow) ではビルドのみ行い、exe は Artifacts からダウンロードできる。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Test
        run: dotnet test -c Release
      - name: Publish
        run: dotnet publish src/VirtualFunctions.App -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o publish
      - uses: actions/upload-artifact@v7
        with:
          name: VirtualFunctions
          path: publish/VirtualFunctions.exe
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "${{ github.ref_name }}" publish/VirtualFunctions.exe --title "${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
